<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Fantasy Mission Control</title>
<link rel="stylesheet" href="app.css">
<script>window.onerror=(m,s,l,c)=>{window.__err=(m+" @"+l+":"+c)};</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="logo">&#127944;</span><div><div class="bt">Mission Control</div><div class="bs lbl" id="brand-season">Fantasy</div></div></div>
    <nav id="nav">
      <button class="nv on" data-view="board"><span>&#128101;</span> Players</button>
      <button class="nv" data-view="team"><span>&#127944;</span> My Team</button>
      <button class="nv" data-view="news"><span>&#128240;</span> News</button>
      <button class="nv" data-view="room"><span>&#9889;</span> Draft Room</button>
      <button class="nv" data-view="copilot"><span>&#129302;</span> Copilot</button>
      <button class="nv" data-view="live"><span>&#127760;</span> Live Draft</button>
      <button class="nv" data-view="settings"><span>&#9881;</span> Settings</button>
    </nav>
    <div class="side-foot">
      <div class="stat"><span>Players</span><b id="s-players">-</b></div>
      <div class="stat"><span>My roster</span><b id="s-roster">0/12</b></div>
      <div class="stat"><span>Engine</span><b class="ok">ff CLI</b></div>
    </div>
  </aside>

  <main id="main">
    <header id="top">
      <div id="crumb">Draft Board</div>
      <div class="pillbar">
        <span class="status" id="draftstatus"><i class="dot amber"></i> Draft: not connected</span>
        <span class="status"><i class="dot green"></i> <span id="values-season">Values</span></span>
      </div>
    </header>
    <section id="view"></section>
    <!-- Persistent authenticated ESPN browsing surface: mounted once so it survives view switches
         and is ALWAYS a CDP target the engine/agent can navigate (through the app's own session,
         never bro). Shown under the Live Draft toolbar; hidden elsewhere. -->
    <div id="webview-layer" class="off">
      <div class="livebar">
        <button class="pbtn" id="lv-back" title="Back">&#8592;</button>
        <button class="pbtn" id="lv-reload" title="Reload">&#8635;</button>
        <button class="pbtn" id="lv-home" title="Fantasy home">Home</button>
        <span class="lv-url mono mut" id="lv-url"></span>
        <span class="lv-status mut" id="lv-status"></span>
      </div>
      <webview id="espnview" partition="persist:espn" src="https://fantasy.espn.com/football/" allowpopups></webview>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
