<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Fantasy Mission Control</title>
<link rel="stylesheet" href="app.css">
<script>window.onerror=(m,s,l,c)=>{window.__err=(m+" @"+l+":"+c)};</script>
</head>
<body>
<div id="app">
  <aside id="agent">
    <div class="brand"><span class="logo">&#129302;</span><div><div class="bt">Assistant</div><div class="bs lbl" id="brand-season">Mission Control</div></div></div>
    <div class="cop-msgs" id="cop-msgs"></div>
    <div class="cop-input">
      <input id="cop-q" placeholder="Ask the assistant…" autocomplete="off">
      <button class="pbtn" id="cop-send">Send</button>
    </div>
    <div class="side-foot">
      <div class="stat"><span>Players</span><b id="s-players">-</b></div>
      <div class="stat"><span>My roster</span><b id="s-roster">0/12</b></div>
      <div class="stat"><span>Engine</span><b class="ok">ff CLI</b></div>
    </div>
  </aside>

  <main id="main">
    <div id="leaguetabs" class="tabrow leagues"></div>
    <div id="pagetabs" class="tabrow pages"></div>
    <!-- content region below the two tab rows; the webview-layer fills THIS (not the tabs) -->
    <div id="content">
      <section id="view"></section>
      <!-- Persistent authenticated ESPN browsing surface: mounted once so it survives page switches
           and is ALWAYS a CDP target the engine/agent can navigate (through the app's own session,
           never bro). Shown for ESPN pages; hidden elsewhere. -->
      <div id="webview-layer" class="off">
        <div class="livebar">
          <button class="pbtn" id="lv-back" title="Back">&#8592;</button>
          <button class="pbtn" id="lv-reload" title="Reload">&#8635;</button>
          <button class="pbtn" id="lv-home" title="Fantasy home">Home</button>
          <span class="lv-url mono mut" id="lv-url"></span>
          <span class="lv-status mut" id="lv-status"></span>
        </div>
        <webview id="espnview" partition="persist:espn" src="https://fantasy.espn.com/football/" allowpopups></webview>
      </div>
    </div>
  </main>
</div>
<script src="vendor/dagre.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
